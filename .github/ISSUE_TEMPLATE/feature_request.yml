name: Feature request
description: Suggest an improvement
title: "[Feature] "

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or architecture you suggest.
    validations:
      required: true

  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation impact
      description: Could this change training data, model behavior, threshold, or metrics?
